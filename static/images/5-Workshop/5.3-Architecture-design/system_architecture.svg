<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Plant Disease Detection — AWS architecture</title>
  <desc id="desc">Architecture for a tomato leaf diagnosis app: GitHub Actions publishes images to GHCR for manual deployment to a single EC2 host; private S3 model artifacts are verified and mounted read-only; Next.js and FastAPI serve users; CloudWatch monitors logs and host metrics and sends RAM alarms through SNS.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#39814a"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526075}.zone-title{font-size:17px;font-weight:700}.zone-sub{font-size:12px;fill:#526075}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:12;filter:url(#shadow)}.node-title{font-size:15px;font-weight:700}.node-text{font-size:12px;fill:#475569}.small{font-size:11px;fill:#475569}.tag{font-size:11px;font-weight:700}.flow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.flow-green{fill:none;stroke:#39814a;stroke-width:2.4;marker-end:url(#greenArrow)}.flow-orange{fill:none;stroke:#d97706;stroke-width:2.4;marker-end:url(#orangeArrow)}.flow-purple{fill:none;stroke:#7c3aed;stroke-width:2.4;marker-end:url(#purpleArrow)}.dash{stroke-dasharray:7 6}.badge{fill:#273449;stroke:#fff;stroke-width:2}.badge-text{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;dominant-baseline:central}.label{font-size:11px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#fff"/>

  <!-- External actors and delivery pipeline -->
  <text x="45" y="44" class="title">Plant Disease Detection</text>
  <text x="45" y="68" class="sub">System architecture · baseline deployment documented for AWS Sydney (ap-southeast-2)</text>
  <text x="1080" y="38" class="node-title">Developer</text>
  <text x="1080" y="57" class="small">pushes source changes</text>
  <g>
    <rect x="45" y="104" width="155" height="76" class="node"/>
    <text x="122" y="133" text-anchor="middle" class="node-title">Offline training</text>
    <text x="122" y="153" text-anchor="middle" class="node-text">ConvNeXt-Tiny teacher</text>
    <text x="122" y="168" text-anchor="middle" class="small">→ distilled MobileNetV3</text>
  </g>
  <g>
    <rect x="295" y="104" width="160" height="76" class="node"/>
    <text x="375" y="135" text-anchor="middle" class="node-title">GitHub repository</text>
    <text x="375" y="157" text-anchor="middle" class="node-text">Application source</text>
  </g>
  <g>
    <rect x="540" y="104" width="175" height="76" class="node"/>
    <text x="627" y="135" text-anchor="middle" class="node-title">GitHub Actions</text>
    <text x="627" y="157" text-anchor="middle" class="node-text">Tests · builds · publishes</text>
  </g>
  <g>
    <rect x="800" y="104" width="175" height="76" class="node"/>
    <text x="887" y="135" text-anchor="middle" class="node-title">GitHub Container Registry</text>
    <text x="887" y="157" text-anchor="middle" class="node-text">Frontend and API images</text>
  </g>
  <g>
    <rect x="1080" y="104" width="205" height="76" class="node"/>
    <text x="1182" y="135" text-anchor="middle" class="node-title">Operator release step</text>
    <text x="1182" y="157" text-anchor="middle" class="node-text">Manual image pull / deployment</text>
  </g>
  <path d="M1080 65H375V99" class="flow-orange"/><circle cx="730" cy="65" r="14" class="badge"/><text x="730" y="65" class="badge-text">1</text>
  <path d="M455 142H535" class="flow-orange"/><circle cx="495" cy="125" r="14" class="badge"/><text x="495" y="125" class="badge-text">2</text><text x="495" y="166" text-anchor="middle" class="label">webhook</text>
  <path d="M715 142H795" class="flow-orange"/><circle cx="755" cy="125" r="14" class="badge"/><text x="755" y="125" class="badge-text">3</text>
  <path d="M975 142H1075" class="flow-orange"/><text x="1025" y="127" text-anchor="middle" class="label">images published</text>
  <path d="M1182 180V226H1320V612" class="flow-orange"/><circle cx="1320" cy="397" r="14" class="badge"/><text x="1320" y="397" class="badge-text">8</text>

  <!-- AWS boundary -->
  <rect x="220" y="215" width="1340" height="820" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/>
  <rect x="220" y="215" width="1340" height="45" rx="12" fill="#f8fafc"/>
  <path d="M220 260H1560" stroke="#cbd5e1"/>
  <text x="246" y="244" font-size="17" font-weight="700">AWS Cloud</text>
  <text x="1440" y="244" text-anchor="end" class="sub">Region ap-southeast-2 · Sydney</text>

  <!-- Model artifact lane -->
  <rect x="245" y="280" width="790" height="260" rx="12" fill="#eff8ef" stroke="#79a879" stroke-width="1.7" stroke-dasharray="7 5"/>
  <text x="268" y="310" class="zone-title" fill="#28633a">1 · Model artifacts &amp; integrity</text>
  <text x="268" y="330" class="zone-sub">Weights are stored privately and fetched by the EC2 host during deployment.</text>
  <rect x="280" y="360" width="205" height="130" class="node"/>
  <text x="382" y="389" text-anchor="middle" class="node-title">Amazon S3</text>
  <text x="382" y="411" text-anchor="middle" class="node-text">Private, versioned artifacts</text>
  <text x="382" y="438" text-anchor="middle" class="small">model.pth · class_to_idx.json</text>
  <text x="382" y="460" text-anchor="middle" class="small">mobilenet-distilled-v1/</text>
  <rect x="600" y="360" width="205" height="130" class="node"/>
  <text x="702" y="389" text-anchor="middle" class="node-title">EC2 host storage</text>
  <text x="702" y="412" text-anchor="middle" class="node-text">Download with instance role</text>
  <text x="702" y="440" text-anchor="middle" class="small">SHA256 integrity check</text>
  <text x="702" y="462" text-anchor="middle" class="small">Versioned checkpoint directory</text>
  <rect x="865" y="373" width="145" height="104" class="node"/>
  <text x="937" y="402" text-anchor="middle" class="node-title">Read-only mount</text>
  <text x="937" y="426" text-anchor="middle" class="small">/app/artifacts:ro</text>
  <text x="937" y="449" text-anchor="middle" class="small">API container</text>
  <path d="M485 425H595" class="flow-green"/><circle cx="540" cy="407" r="14" class="badge"/><text x="540" y="407" class="badge-text">5</text><text x="540" y="449" text-anchor="middle" class="label">aws s3 cp · IAM</text>
  <path d="M805 425H860" class="flow-green"/><circle cx="833" cy="407" r="14" class="badge"/><text x="833" y="407" class="badge-text">6–7</text><text x="833" y="449" text-anchor="middle" class="label">verify · mount :ro</text>
  <path d="M122 180V390H275" class="flow-green"/><circle cx="242" cy="390" r="14" class="badge"/><text x="242" y="390" class="badge-text">4</text><text x="164" y="373" class="label">release artifacts</text>

  <!-- Operations lane -->
  <rect x="1060" y="280" width="475" height="430" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.7" stroke-dasharray="7 5"/>
  <text x="1083" y="310" class="zone-title">4 · Operations &amp; security</text>
  <rect x="1085" y="337" width="425" height="76" class="node"/>
  <text x="1105" y="363" class="node-title">AWS IAM instance profile</text>
  <text x="1105" y="385" class="node-text">Scoped S3 GetObject + CloudWatch agent permissions</text>
  <rect x="1085" y="430" width="425" height="76" class="node"/>
  <text x="1105" y="456" class="node-title">CloudWatch Logs</text>
  <text x="1105" y="478" class="node-text">Docker awslogs · frontend and backend · 7-day retention</text>
  <rect x="1085" y="523" width="195" height="78" class="node"/>
  <text x="1182" y="550" text-anchor="middle" class="node-title">CloudWatch Agent</text>
  <text x="1182" y="573" text-anchor="middle" class="small">RAM + disk · every 60 s</text>
  <rect x="1085" y="620" width="195" height="66" class="node"/>
  <text x="1182" y="646" text-anchor="middle" class="node-title">CloudWatch Metrics</text>
  <text x="1182" y="667" text-anchor="middle" class="small">PlantDisease/Host</text>
  <rect x="1310" y="523" width="200" height="78" class="node"/>
  <text x="1410" y="550" text-anchor="middle" class="node-title">CloudWatch RAM Alarm</text>
  <text x="1410" y="573" text-anchor="middle" class="small">&gt;85% · 3 × 1-minute periods</text>
  <rect x="1310" y="620" width="200" height="66" class="node"/>
  <text x="1410" y="646" text-anchor="middle" class="node-title">Amazon SNS</text>
  <text x="1410" y="667" text-anchor="middle" class="small">Confirmed email subscription</text>
  <path d="M1182 601V615" class="flow"/><circle cx="1154" cy="608" r="13" class="badge"/><text x="1154" y="608" class="badge-text">16</text>
  <path d="M1280 653H1295V562H1305" class="flow"/><circle cx="1292" cy="653" r="13" class="badge"/><text x="1292" y="653" class="badge-text">17</text>
  <path d="M1410 601V615" class="flow"/><circle cx="1440" cy="608" r="13" class="badge"/><text x="1440" y="608" class="badge-text">18</text>
  <path d="M1010 465H1050V375H1080" class="flow dash"/><text x="1038" y="453" text-anchor="middle" class="label" transform="rotate(-90 1038 453)">instance role</text>
  <path d="M1000 650H1078V468" class="flow dash"/><circle cx="1040" cy="650" r="14" class="badge"/><text x="1040" y="650" class="badge-text">15</text>
  <path d="M1000 674H1050V561H1080" class="flow dash"/>

  <!-- Runtime lane -->
  <rect x="245" y="565" width="790" height="430" rx="12" fill="#f5effb" stroke="#9b79b9" stroke-width="1.7" stroke-dasharray="7 5"/>
  <text x="268" y="595" class="zone-title" fill="#633b87">3 · Web application &amp; AI inference</text>
  <text x="268" y="615" class="zone-sub">One Amazon Linux 2023 EC2 host · Docker · CPU inference</text>
  <rect x="275" y="658" width="145" height="172" class="node"/>
  <text x="347" y="687" text-anchor="middle" class="node-title">Security Group</text>
  <text x="347" y="710" text-anchor="middle" class="small">Public subnet</text>
  <text x="347" y="742" text-anchor="middle" class="tag" fill="#6d28d9">:3000 Web UI</text>
  <text x="347" y="764" text-anchor="middle" class="tag" fill="#6d28d9">:8000 API</text>
  <text x="347" y="790" text-anchor="middle" class="small">Ingress source restricted</text>
  <text x="347" y="807" text-anchor="middle" class="small">to approved IP /32</text>
  <rect x="480" y="658" width="220" height="172" class="node"/>
  <text x="590" y="687" text-anchor="middle" class="node-title">Next.js frontend</text>
  <text x="590" y="710" text-anchor="middle" class="node-text">Standalone container · :3000</text>
  <text x="590" y="742" text-anchor="middle" class="small">Leaf photo upload (JPEG / PNG)</text>
  <text x="590" y="764" text-anchor="middle" class="small">Responsive browser UI</text>
  <text x="590" y="797" text-anchor="middle" class="small">Returns diagnosis and heatmap</text>
  <rect x="760" y="658" width="245" height="172" class="node"/>
  <text x="882" y="687" text-anchor="middle" class="node-title">FastAPI inference API</text>
  <text x="882" y="710" text-anchor="middle" class="node-text">PyTorch CPU container · :8000</text>
  <circle cx="790" cy="739" r="11" class="badge"/><text x="790" y="739" class="badge-text">12</text>
  <text x="894" y="742" text-anchor="middle" class="small">MobileNetV3-Small · 11 classes</text>
  <circle cx="790" cy="766" r="11" class="badge"/><text x="790" y="766" class="badge-text">13</text>
  <text x="894" y="769" text-anchor="middle" class="small">Grad-CAM++ explainability</text>
  <text x="882" y="797" text-anchor="middle" class="small">JSON + heatmap overlay response</text>
  <path d="M420 744H475" class="flow-purple"/><circle cx="447" cy="724" r="14" class="badge"/><text x="447" y="724" class="badge-text">9</text>
  <path d="M700 744H755" class="flow-purple"/><circle cx="727" cy="724" r="14" class="badge"/><text x="727" y="724" class="badge-text">11</text><text x="727" y="769" text-anchor="middle" class="label">POST /predict</text>
  <path d="M760 788H700" class="flow-purple"/><circle cx="729" cy="806" r="14" class="badge"/><text x="729" y="806" class="badge-text">14</text>
  <text x="590" y="900" text-anchor="middle" class="label">Prediction and explanation are computed in the FastAPI process.</text>
  <rect x="300" y="923" width="680" height="48" rx="9" fill="#fff" stroke="#ddd2eb"/>
  <text x="640" y="944" text-anchor="middle" class="tag" fill="#53317c">Model checkpoint is loaded from the read-only artifact mount at API startup</text>
  <text x="640" y="961" text-anchor="middle" class="small">Uploaded user images are processed for inference and are not persisted to S3 in this baseline.</text>
  <path d="M937 477V650" class="flow-green"/><circle cx="937" cy="560" r="14" class="badge"/><text x="937" y="560" class="badge-text">7</text>

  <!-- Users / ingress -->
  <rect x="35" y="690" width="150" height="92" class="node"/>
  <text x="110" y="721" text-anchor="middle" class="node-title">Users</text>
  <text x="110" y="744" text-anchor="middle" class="node-text">Farmers · agronomists</text>
  <text x="110" y="765" text-anchor="middle" class="small">Mobile / desktop browser</text>
  <path d="M185 736H268" class="flow-purple"/><circle cx="226" cy="716" r="14" class="badge"/><text x="226" y="716" class="badge-text">9</text><text x="226" y="759" text-anchor="middle" class="label">HTTP · restricted ingress</text>
  <path d="M185 752H235V850H882V835" class="flow-purple dash"/><text x="530" y="843" text-anchor="middle" class="label">API access at the same EC2 host · :8000</text>
  <path d="M347 658V632H590V653" class="flow-purple"/><circle cx="455" cy="632" r="14" class="badge"/><text x="455" y="632" class="badge-text">10</text>

  <!-- Notes / boundary choices -->
  <rect x="1060" y="735" width="475" height="230" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1085" y="772" class="node-title">Deployment boundaries</text>
  <text x="1085" y="805" class="node-text">• Single EC2 host; no load balancer or autoscaling.</text>
  <text x="1085" y="832" class="node-text">• Public subnet with inbound rules locked to an approved /32.</text>
  <text x="1085" y="859" class="node-text">• S3 is read during deployment; no S3 image-upload pipeline.</text>
  <text x="1085" y="886" class="node-text">• Images are built and published automatically; EC2 rollout is manual.</text>
  <text x="1085" y="930" class="small">Diagram reflects the documented baseline, not unverified AWS live state.</text>

  <!-- log and metrics flows -->
</svg>
